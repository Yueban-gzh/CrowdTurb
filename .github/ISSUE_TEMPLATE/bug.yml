name: 缺陷
description: 报告可复现的产品、算法或接口问题
title: '[缺陷] '
body:
  - type: input
    id: requirement
    attributes:
      label: 关联需求与代码版本
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 环境、输入和复现步骤
      description: 附场景版本、算法配置和种子；不要上传密钥。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 预期结果、实际结果与影响
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 日志、截图或结果文件
