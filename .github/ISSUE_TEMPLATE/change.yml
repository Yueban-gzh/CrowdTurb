name: 需求或契约变更
description: 记录范围、字段和技术决策变化及影响
title: '[变更] '
body:
  - type: textarea
    id: reason
    attributes:
      label: 变化内容与原因
      description: 引用受影响需求和现行基线。
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 对模块、排期、测试和兼容性的影响
      description: 包含代价、替代方案、迁移及回退办法。
    validations:
      required: true
  - type: input
    id: reviewers
    attributes:
      label: 需要参与评审的成员
    validations:
      required: true
