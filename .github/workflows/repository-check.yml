name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-check:
    name: repository-check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install check dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate repository and mock contracts
        run: python tools/check_repository.py
      - name: Reject invalid integration payloads
        run: python -m unittest discover -s tests/contracts -v
      - name: Check scene geometry and passage candidates
        run: python -m unittest discover -s apps/web/scene-config/tests -v
      - name: Check trajectory aggregation and D candidate search
        run: python -m unittest discover -s packages/analysis/tests -v
